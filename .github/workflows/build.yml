name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node test/parse.test.js
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: verso-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          cat > notes.md <<NOTES
          Verso ${VERSION} (test build). Free word-by-word synced lyrics for Ubuntu and Windows. Private repo: log in to GitHub as federicotaar to download.

          **What's new in 0.1.1**
          - Fullscreen by default: edge to edge, matte black, no window frame. Esc or Ctrl/Cmd+Shift+F leaves fullscreen.
          - New default style, Lyric map: the current lyric is big, a line draws to the next one, sung lyrics shrink and stay on the map while the camera follows the new line. The path wanders up, down, left and right.
          - Some words are set in an elegant handwriting font (Great Vibes, SIL OFL, bundled).
          - Upgrading from 0.1.0 switches your style to Lyric map and fullscreen once; your other settings are kept. You can change the style from the tray after that.

          **Ubuntu:** download the .AppImage, run chmod +x Verso-${VERSION}.AppImage, then launch it. Or install the .deb: sudo apt install ./verso_${VERSION}_amd64.deb.
          **Windows:** run the Setup exe to install, or the portable exe to try without installing. The app lives in the system tray.

          **Test status (honest):**
          - Checked: the visuals in a browser render and the Electron window in a virtual display on Linux (fullscreen fills the screen, Esc leaves it, settings upgrade works); music detection with real VLC over MPRIS on Linux; CI builds both platforms.
          - Not checked: any real Windows machine (exe never launched, Windows now-playing untested), a real Ubuntu desktop session, Spotify itself.
          - Lyrics come from the free LRCLIB service. Word timings are estimated from line timings, not true per-word sync.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing to overwrite it. Bump package.json version."; exit 1; fi
          gh release create "$TAG" \
            artifacts/verso-ubuntu-latest/*.AppImage \
            artifacts/verso-ubuntu-latest/*.deb \
            artifacts/verso-windows-latest/*.exe \
            --title "Verso ${VERSION} (test build)" \
            --notes-file notes.md
