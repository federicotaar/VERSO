name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable nsis --publish never
      - name: Build (macOS, Intel and Apple silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > /tmp/verso-adhoc.cjs <<'JS'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs'),path=require('node:path');
          exports.default=async function(ctx) {
            const app=path.join(ctx.appOutDir,'Verso.app');
            const codesign=(p)=>execFileSync('/usr/bin/codesign',['--force','--sign','-',p],{stdio:'inherit'});
            // Resource binaries are outside standard nested-code locations. Seal each
            // Mach-O first, then the Electron helpers/frameworks and outer app.
            const magic=new Set(['feedface','feedfacf','cefaedfe','cffaedfe','cafebabe','bebafeca','cafebabf','bfbafeca']);
            function walk(dir) {
              for(const e of fs.readdirSync(dir,{withFileTypes:true})) {
                const p=path.join(dir,e.name);
                if(e.isDirectory()) walk(p);
                else if(e.isFile()) {
                  const fd=fs.openSync(p,'r'),b=Buffer.alloc(4);
                  try { fs.readSync(fd,b,0,4,0); } finally { fs.closeSync(fd); }
                  if(magic.has(b.toString('hex'))) codesign(p);
                }
              }
            }
            walk(path.join(app,'Contents/Resources'));
            execFileSync('/usr/bin/codesign',['--force','--deep','--sign','-',app],{stdio:'inherit'});
            execFileSync('/usr/bin/codesign',['--verify','--deep','--strict',app],{stdio:'inherit'});
          };
          JS
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never -c.afterPack=/tmp/verso-adhoc.cjs
      - name: Check Mac native backend and packaged app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module -e 'import {current,nativeBindingPath} from "now-playing-media"; console.log(nativeBindingPath()); console.log(await current());'
          if [ "$(uname -m)" = "arm64" ]; then APP=dist/mac-arm64/Verso.app; else APP=dist/mac/Verso.app; fi
          APP="$PWD/$APP"
          test -f "$APP/Contents/Resources/app.asar.unpacked/node_modules/now-playing-media/prebuilds/darwin-$(node -p process.arch)/now-playing-media.node"
          codesign --verify --deep --strict "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Verso" -e 'const {createRequire}=require("module"); const r=createRequire(process.argv[1]+"/Contents/Resources/app.asar/package.json"); const p=r.resolve("now-playing-media"); import(require("url").pathToFileURL(p).href).then(async m=>console.log(await m.current())).catch(e=>{console.error(e);process.exit(1)})' "$APP"
          VERSO_DEMO=1 VERSO_SHOT="$PWD/dist/mac-demo.png" VERSO_SHOT_MS=9000 "$APP/Contents/MacOS/Verso"
          test -s dist/mac-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verso-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          cat > notes.md <<'NOTES'
          Verso 0.1.6 - hand-drawn pen-stroke connectors, plus Mac, Ubuntu and Windows builds. Free, public downloads.
          
          New: connectors between verses draw like a hand-drawn pen stroke - a main line with a rough twin stroke (seeded per song, no flicker) and a soft glow that pulses slowly, sketched on as the next verse approaches. Lyric map, camera, mixed typography, sung lines staying on the map and whole-line lighting stay unchanged. Mac (Apple silicon and Intel), Ubuntu and Windows packages. No Spotify API, login or Premium required.
          
          Mac: macOS 11+, drag Verso into Applications. Ad-hoc signed only, not Developer ID signed or notarized. macOS may block the first open. If macOS offers it, verify this release then use System Settings > Privacy & Security > Open Anyway. Do not disable Gatekeeper. Managed Macs may disallow opening. Intel and Apple silicon downloads are separate.
          
          Quit the older Verso from its tray/menu before installing over it. Windows: Setup or portable exe. Ubuntu: AppImage or deb.
          
          Testing: CI packages three platforms. Mac smoke tests exercise the native addon and launch the packaged host-architecture app with demo lyrics, not live Spotify. The new connectors were screenshot-tested in a headless-Chrome demo harness. Real Spotify Free, Mac Gatekeeper/install flow, Intel/Apple silicon on-device playback and Windows runtime remain unverified. Spotify desktop must report a local OS media session; ads or missing LRCLIB lyrics may show no lyrics. Line timing only, no per-word highlight.
          
          Browser: menu > Open lyrics in browser (this PC only), keep Verso running. Same computer only. Older releases retained. See README for setup and exact test limits.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing to overwrite it. Bump package.json version."; exit 1; fi
          gh release create "$TAG" \
            artifacts/verso-ubuntu-latest/*.AppImage \
            artifacts/verso-ubuntu-latest/*.deb \
            artifacts/verso-windows-latest/*.exe \
            artifacts/verso-macos-latest/*.dmg \
            artifacts/verso-macos-latest/*.zip \
            --title "Verso ${VERSION} (Mac + PC)" \
            --notes-file notes.md
