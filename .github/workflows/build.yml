name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node test/parse.test.js
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: verso-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 && gh release delete v0.1.0 --yes --cleanup-tag || true
          gh release create v0.1.0 \
            artifacts/verso-ubuntu-latest/* \
            artifacts/verso-windows-latest/* \
            --title "Verso 0.1.0 (test build)" \
            --notes "Test build of Verso, the free word-by-word lyrics overlay. Ubuntu: download the .AppImage, chmod +x it, and run it (or install the .deb with sudo apt install ./verso_0.1.0_amd64.deb). Windows: run the NSIS Setup exe (or the portable exe, no install). Private repo: you must be logged into GitHub as federicotaar to download."
