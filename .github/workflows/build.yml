name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node test/parse.test.js
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable nsis
      - uses: actions/upload-artifact@v4
        with:
          name: verso-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
